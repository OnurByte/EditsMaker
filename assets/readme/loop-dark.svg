<text x="40" y="56" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="30" fill="#F4F1EA" text-anchor="start" letter-spacing="-1">Render, look, fix</text>
