<rect x="508" y="110" width="28" height="4" fill="#E5332A"/>
<text x="508" y="140" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="700" font-size="18" fill="#0B0B0C" text-anchor="start" letter-spacing="0">Reads first</text>
<text x="508" y="166" font-family="Helvetica Neue, Helvetica, Arial, Liberation Sans, sans-serif" font-weight="300" font-size="14" fill="#8C877C" text-anchor="start" letter-spacing="0">Skims every video's</text>
