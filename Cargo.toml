[package]
name = "edits"
version = "0.31.1"
edition = "2021"
description = "One small download (under 15 MB, with its desktop app) that turns any YouTube link, channel or topic into viral TikTok, Reels and Shorts edits: Alight Motion and Premiere presets, trending songs, beat-synced cuts, captions, colour looks, MCP server for AI agents."
repository = "https://github.com/OnurByte/EditsMaker"
homepage = "https://github.com/OnurByte/EditsMaker"
readme = "README.md"
keywords = ["video-editor", "tiktok", "shorts", "ffmpeg", "mcp"]
categories = ["command-line-utilities", "multimedia::video"]
license = "MIT"

# the desktop app (src/app, GPUI and gpui-kit) is inside edits: `edits app`. A server build without a screen:
# cargo build --release --no-default-features
[features]
default = ["app"]
app = ["dep:gpui-kit", "dep:kael_share"]

[dependencies]
gpui-kit = { version = "0.10.0", optional = true }
# the system's own share sheet (macOS, Windows; mail on Linux), for Share on a clip or a pack; 0.4 pins a wasm-bindgen GPUI cannot share
kael_share = { version = "=0.3.0", optional = true }
regex = "1"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
libloading = "0.8"
roxmltree = "0.21.2"
rustface = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# small on purpose: the download is a selling point, and the heavy lifting is ffmpeg's (opt "s" costs ~5% on learn)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
