[package]
name = "edits"
version = "0.2.0"
edition = "2021"
description = "Turn any YouTube link, channel or topic into viral TikTok, Reels and Shorts edits: Alight Motion and Premiere presets, trending songs, beat-synced cuts, captions, colour looks, MCP server for AI agents."
repository = "https://github.com/OnurByte/EditsMaker"
homepage = "https://github.com/OnurByte/EditsMaker"
readme = "README.md"
keywords = ["video-editor", "tiktok", "shorts", "ffmpeg", "mcp"]
categories = ["command-line-utilities", "multimedia::video"]
license = "MIT"

[dependencies]
regex = "1"
roxmltree = "0.21.2"
rustface = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
