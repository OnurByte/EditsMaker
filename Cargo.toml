[package]
name = "edits"
version = "0.31.0"
edition = "2021"
description = "One small download (under 15 MB, with its desktop app) that turns any YouTube link, channel or topic into viral TikTok, Reels and Shorts edits: Alight Motion and Premiere presets, trending songs, beat-synced cuts, captions, colour looks, MCP server for AI agents."
repository = "https://github.com/OnurByte/EditsMaker"
homepage = "https://github.com/OnurByte/EditsMaker"
readme = "README.md"
keywords = ["video-editor", "tiktok", "shorts", "ffmpeg", "mcp"]
categories = ["command-line-utilities", "multimedia::video"]
license = "MIT"

# the desktop app (apps/desktop, GPUI) is its own binary, so `edits` still runs where there is no screen;
# `cargo test` and `cargo build` here stay the CLI's, `-p edits-app` builds the app
[workspace]
members = [".", "apps/desktop"]
default-members = ["."]

[dependencies]
regex = "1"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts", "raster-images"] }
libloading = "0.8"
roxmltree = "0.21.2"
rustface = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# small on purpose: the download is a selling point, and the heavy lifting is ffmpeg's (opt "s" costs ~5% on learn)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# the desktop app: built with --profile app, smallest over fastest (it waits on edits, not on itself)
[profile.app]
inherits = "release"
opt-level = "z"
panic = "abort"
