<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review edit</title>
<style>
  :root {
    --bg: #0b0b0c; --panel: #151517; --line: #26262a; --text: #f2f2f3; --dim: #9a9aa2;
    --accent: #e5332a; --accent-text: #fff; --chip: #222226; --ok: #3ccf7a;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f6f6f7; --panel: #fff; --line: #e2e2e6; --text: #121214; --dim: #62626a; --chip: #efeff2; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 20px 6px; }
  h1 { font-size: 17px; margin: 0; word-break: break-all; }
  .meta { color: var(--dim); font-size: 13px; margin-top: 4px; }
  main { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 20px; padding: 14px 20px 28px; align-items: start; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; padding: 12px 16px 24px; } }
  .stage { position: sticky; top: 12px; }
  .frame { position: relative; background: #000; border-radius: 12px; overflow: hidden; }
  video { display: block; width: 100%; max-height: 74vh; background: #000; cursor: crosshair; }
  .pin { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 3px solid var(--accent); background: rgba(229,51,42,.25); pointer-events: none; }
  .hint { color: var(--dim); font-size: 12.5px; margin: 8px 2px 0; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 9px; padding: 8px 13px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 10px; }
  .shots { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .shot { flex: 0 0 auto; width: 74px; text-align: center; font-size: 11.5px; color: var(--dim); cursor: pointer; }
  .shot img, .shot .ph { width: 74px; aspect-ratio: var(--ar, 9/16); object-fit: cover; border-radius: 7px; border: 2px solid transparent; background: var(--chip); display: block; }
  .shot.now img, .shot.now .ph { border-color: var(--accent); }
  .note { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
  .note:first-child { border-top: 0; }
  .chip { background: var(--chip); border-radius: 7px; padding: 4px 8px; font-size: 12.5px; white-space: nowrap; cursor: pointer; font-variant-numeric: tabular-nums; }
  textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; resize: vertical; min-height: 38px; }
  .x { border: 0; background: none; color: var(--dim); padding: 4px 6px; font-size: 18px; line-height: 1; }
  .empty { color: var(--dim); font-size: 13.5px; }
  .sent { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1 id="name"></h1>
  <div class="meta" id="meta"></div>
</header>
<main>
  <div class="stage">
    <div class="frame" id="frame">
      <video id="v" src="/video" controls playsinline preload="auto"></video>
    </div>
    <p class="hint">Click the picture to point at a spot. <b>N</b> adds a note at this moment, <b>Space</b> plays or pauses.</p>
    <div class="row">
      <button id="here">Note at this moment</button>
      <button class="primary" id="send">Send to agent</button>
      <span id="status" class="hint"></span>
    </div>
  </div>
  <div>
    <section>
      <h2>Shots</h2>
      <div class="shots" id="shots"></div>
    </section>
    <section>
      <h2>Notes</h2>
      <div id="notes"><p class="empty">No notes yet. Click the picture or a shot, then say what to change.</p></div>
    </section>
    <section>
      <h2>About the whole edit</h2>
      <textarea id="general" rows="3" placeholder="The song, the pace, the length, anything"></textarea>
    </section>
  </div>
</main>
<script>
/*CONFIG*/
const v = document.getElementById('v'), frame = document.getElementById('frame');
const notesEl = document.getElementById('notes'), shotsEl = document.getElementById('shots');
const starts = [0, ...CFG.cuts.filter(c => c > 0.05 && c < CFG.total - 0.05)];
let notes = [], sent = false;
document.getElementById('name').textContent = CFG.name;
document.getElementById('meta').textContent = [CFG.total.toFixed(1) + ' s', starts.length + ' shots', ...CFG.about].join(' · ');

const fmt = t => t.toFixed(1) + 's';
const shotOf = t => { let i = 0; starts.forEach((s, k) => { if (t >= s - 0.01) i = k; }); return i; };

function pins() {
  frame.querySelectorAll('.pin').forEach(p => p.remove());
  notes.filter(n => n.x != null && Math.abs(n.t - v.currentTime) < 0.4).forEach(n => {
    const p = document.createElement('div');
    p.className = 'pin';
    p.style.left = (n.x * 100) + '%';
    p.style.top = (n.y * v.clientHeight / frame.clientHeight * 100) + '%';
    frame.appendChild(p);
  });
}

function draw() {
  if (!notes.length) {
    notesEl.innerHTML = '<p class="empty">No notes yet. Click the picture or a shot, then say what to change.</p>';
    return;
  }
  notesEl.innerHTML = '';
  notes.sort((a, b) => a.t - b.t).forEach((n, i) => {
    const row = document.createElement('div');
    row.className = 'note';
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = fmt(n.t) + ' · shot ' + (shotOf(n.t) + 1) + (n.x != null ? ' · ◎' : '');
    chip.title = 'Jump there';
    chip.onclick = () => { v.currentTime = n.t; v.pause(); };
    const ta = document.createElement('textarea');
    ta.value = n.text;
    ta.placeholder = 'What should change here?';
    ta.oninput = () => { n.text = ta.value; };
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.title = 'Remove';
    x.onclick = () => { notes.splice(notes.indexOf(n), 1); draw(); pins(); };
    row.append(chip, ta, x);
    notesEl.appendChild(row);
    if (n.fresh) { ta.focus(); n.fresh = false; }
  });
}

function add(t, x, y) {
  if (sent) return;
  notes.push({ t: Math.round(t * 100) / 100, x, y, text: '', fresh: true });
  draw();
  pins();
}

v.addEventListener('click', e => {
  // the controls bar at the bottom stays a control bar
  const r = v.getBoundingClientRect();
  if (e.clientY > r.bottom - 48) return;
  e.preventDefault();
  v.pause();
  add(v.currentTime, Math.round((e.clientX - r.left) / r.width * 1000) / 1000, Math.round((e.clientY - r.top) / r.height * 1000) / 1000);
});
v.addEventListener('timeupdate', () => {
  const i = shotOf(v.currentTime);
  shotsEl.querySelectorAll('.shot').forEach((s, k) => s.classList.toggle('now', k === i));
  pins();
});
document.getElementById('here').onclick = () => { v.pause(); add(v.currentTime, null, null); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); v.pause(); add(v.currentTime, null, null); }
  if (e.key === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
});

document.getElementById('send').onclick = async () => {
  const status = document.getElementById('status');
  const body = { notes: notes.filter(n => n.text.trim()).map(({ t, x, y, text }) => ({ t, x, y, text: text.trim() })), general: document.getElementById('general').value.trim() };
  if (!body.notes.length && !body.general) { status.textContent = 'Write a note first.'; return; }
  try {
    const r = await fetch('/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    sent = true;
    document.getElementById('send').disabled = document.getElementById('here').disabled = true;
    status.innerHTML = '<span class="sent">Sent to the agent.</span> You can close this tab.';
  } catch (err) {
    status.textContent = 'Could not send (' + err.message + '). Is edits still running?';
  }
};

// a picture of each shot, taken from a second copy of the video one shot at a time
starts.forEach((s, k) => {
  const d = document.createElement('div');
  d.className = 'shot';
  d.innerHTML = '<div class="ph"></div>' + fmt(s);
  d.onclick = () => { v.currentTime = s + 0.05; v.pause(); };
  shotsEl.appendChild(d);
});
const grab = document.createElement('video');
grab.src = '/video'; grab.muted = true; grab.preload = 'auto';
let k = 0;
const canvas = document.createElement('canvas');
grab.addEventListener('loadedmetadata', () => {
  document.documentElement.style.setProperty('--ar', grab.videoWidth + '/' + grab.videoHeight);
  canvas.width = 148; canvas.height = Math.round(148 * grab.videoHeight / grab.videoWidth);
  grab.currentTime = Math.min(starts[0] + 0.15, CFG.total - 0.05);
});
grab.addEventListener('seeked', () => {
  canvas.getContext('2d').drawImage(grab, 0, 0, canvas.width, canvas.height);
  const img = new Image();
  img.src = canvas.toDataURL('image/jpeg', 0.7);
  const cell = shotsEl.children[k];
  cell.replaceChild(img, cell.firstChild);
  k += 1;
  if (k < starts.length) grab.currentTime = Math.min(starts[k] + 0.15, CFG.total - 0.05);
});
</script>
</body>
</html>
