name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      # what GPUI (the app inside edits) builds against on Linux
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libx11-xcb-dev libvulkan-dev
      - run: cargo test --release
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir out
          tar -czf out/edits-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release edits
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir out
          Compress-Archive -Path target/${{ matrix.target }}/release/edits.exe -DestinationPath out/edits-${{ matrix.target }}.zip
      # the download is a selling point: edits, its app inside, stays under 15 MB
      - name: size
        shell: bash
        run: |
          f=$(ls out/*); n=$(wc -c < "$f")
          echo "$f: $n bytes"
          [ "$n" -le 15728640 ] || { echo "$f is over 15 MB"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: edits-${{ matrix.target }}
          path: out/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # every release gets what changed and how to install, never an empty page
      - run: sh .github/notes.sh "$GITHUB_REF_NAME" > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: out/*
