<text x="32" y="48" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="hsl(250,70%,64%)">Pack</text>
<text x="32" y="94" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">edits-tricks</text>
<text x="32" y="130" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#fff" fill-opacity="0.72">Editing tricks from short-form editing guides (hook, beat</text>
<text x="32" y="154" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#fff" fill-opacity="0.72">sync, speed ramps, impact zoom, colour split, flashes, loops,</text>
<text x="32" y="178" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#fff" fill-opacity="0.72">genre grades) turned into `edits` preset values. Use when an</text>
<text x="32" y="202" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#fff" fill-opacity="0.72">edit feels flat, the hook is weak, cuts miss the beat, or the</text>
<text x="32" y="226" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#fff" fill-opacity="0.72">user asks for a genre (phonk, velocity, twixtor/smooth,</text>
<text x="32" y="250" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#fff" fill-opacity="0.72">glitch, retro, loop) or &quot;make it hit harder&quot;.</text>
<text x="32" y="336" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="hsl(250,70%,64%)">edits skills install</text>
